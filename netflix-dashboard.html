<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Netflix Analysis Dashboard — Om Mistry</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,500;0,600;1,400&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #12141A; --panel: #1A1E27; --panel-line: #262B36;
    --text: #E9E6DE; --text-dim: #8890A0; --accent: #5FD9C4; --accent-2: #E8A855;
    --serif: 'Newsreader', serif; --sans: 'IBM Plex Sans', sans-serif; --mono: 'IBM Plex Mono', monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text); font-family: var(--sans); line-height: 1.5;
    background-image: linear-gradient(var(--panel-line) 1px, transparent 1px), linear-gradient(90deg, var(--panel-line) 1px, transparent 1px);
    background-size: 64px 64px;
  }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 40px 24px 80px; }
  .dash-header { display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 20px; margin-bottom: 32px; padding-bottom: 24px; border-bottom: 1px solid var(--panel-line); }
  .dash-header .kicker { font-family: var(--mono); font-size: 12px; color: var(--accent); margin-bottom: 10px; }
  .dash-header h1 { font-family: var(--serif); font-weight: 500; font-size: 32px; }
  .back-link { font-family: var(--mono); font-size: 13px; color: var(--text-dim); text-decoration: none; border-bottom: 1px solid var(--panel-line); }
  .back-link:hover { color: var(--accent); border-color: var(--accent); }
  .filter-row { display: flex; align-items: center; gap: 14px; margin-bottom: 28px; font-family: var(--mono); font-size: 13px; color: var(--text-dim); }
  select { background: var(--panel); color: var(--text); border: 1px solid var(--panel-line); padding: 8px 12px; border-radius: 3px; font-family: var(--mono); font-size: 13px; }
  select:focus { outline: 1px solid var(--accent); }
  .kpi-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 32px; }
  .kpi-card { background: var(--panel); border: 1px solid var(--panel-line); border-radius: 4px; padding: 20px; }
  .kpi-card .label { font-family: var(--mono); font-size: 11.5px; color: var(--text-dim); text-transform: lowercase; }
  .kpi-card .value { font-family: var(--serif); font-size: 28px; margin-top: 8px; color: var(--text); }
  .kpi-card.warn .value { color: var(--accent-2); }
  .kpi-card.good .value { color: var(--accent); }
  .chart-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
  .chart-card { background: var(--panel); border: 1px solid var(--panel-line); border-radius: 4px; padding: 20px; }
  .chart-card h3 { font-family: var(--sans); font-weight: 500; font-size: 14px; color: var(--text); margin-bottom: 16px; }
  .chart-card .chart-wrap { position: relative; height: 260px; }
  .full-row { grid-column: 1 / -1; }
  footer { margin-top: 40px; font-family: var(--mono); font-size: 11.5px; color: var(--text-dim); opacity: 0.6; }
  @media (max-width: 800px) { .kpi-row { grid-template-columns: repeat(2, 1fr); } .chart-grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="dash-header">
    <div>
      <div class="kicker">// netflix catalog — 8,807 real titles</div>
      <h1>Netflix Analysis Dashboard</h1>
    </div>
    <a class="back-link" href="index.html">← back to portfolio</a>
  </div>

  <div class="filter-row">
    <span>Filter by type:</span>
    <select id="typeFilter">
      <option value="All">All</option>
      <option value="Movie">Movies</option>
      <option value="TV Show">TV Shows</option>
    </select>
  </div>

  <div class="kpi-row">
    <div class="kpi-card"><div class="label">total titles</div><div class="value" id="kpiTotal">—</div></div>
    <div class="kpi-card good"><div class="label">% movies</div><div class="value" id="kpiMoviePct">—</div></div>
    <div class="kpi-card warn"><div class="label">top rating</div><div class="value" id="kpiTopRating">—</div></div>
    <div class="kpi-card"><div class="label">peak year added</div><div class="value" id="kpiPeakYear">—</div></div>
  </div>

  <div class="chart-grid">
    <div class="chart-card">
      <h3>Movies vs. TV Shows</h3>
      <div class="chart-wrap"><canvas id="typeChart"></canvas></div>
    </div>
    <div class="chart-card">
      <h3>Top content ratings</h3>
      <div class="chart-wrap"><canvas id="ratingChart"></canvas></div>
    </div>
    <div class="chart-card full-row">
      <h3>Titles added per year</h3>
      <div class="chart-wrap"><canvas id="yearChart"></canvas></div>
    </div>
  </div>

  <footer>Data: Netflix Movies and TV Shows dataset, 8,807 titles (as of 2021).</footer>
</div>

<script>
let allData = [];
let charts = {};
const palette = { accent: '#5FD9C4', accent2: '#E8A855', dim: '#8890A0', line: '#262B36' };
Chart.defaults.color = palette.dim;
Chart.defaults.font.family = "'IBM Plex Sans', sans-serif";
Chart.defaults.font.size = 11.5;

fetch('netflix-data.json')
  .then(r => r.json())
  .then(data => { allData = data; render('All'); })
  .catch(() => {
    document.querySelector('.wrap').insertAdjacentHTML('afterbegin',
      '<p style="color:#E8A855;font-family:monospace;margin-bottom:20px;">Could not load netflix-data.json — make sure it sits alongside this file.</p>');
  });

document.getElementById('typeFilter').addEventListener('change', e => render(e.target.value));

function render(type) {
  const data = type === 'All' ? allData : allData.filter(d => d.type === type);
  const total = data.length;
  const movies = data.filter(d => d.type === 'Movie').length;
  const moviePct = total ? (100 * movies / total).toFixed(1) : '0.0';

  const ratingCounts = {};
  data.forEach(d => { ratingCounts[d.rating] = (ratingCounts[d.rating] || 0) + 1; });
  const topRating = Object.entries(ratingCounts).sort((a, b) => b[1] - a[1])[0];

  const yearCounts = {};
  data.forEach(d => { if (d.year_added) yearCounts[d.year_added] = (yearCounts[d.year_added] || 0) + 1; });
  const peakYear = Object.entries(yearCounts).sort((a, b) => b[1] - a[1])[0];

  document.getElementById('kpiTotal').textContent = total.toLocaleString();
  document.getElementById('kpiMoviePct').textContent = moviePct + '%';
  document.getElementById('kpiTopRating').textContent = topRating ? topRating[0] : '—';
  document.getElementById('kpiPeakYear').textContent = peakYear ? peakYear[0] : '—';

  renderTypeChart(data);
  renderRatingChart(ratingCounts);
  renderYearChart(yearCounts);
}

function renderTypeChart(data) {
  const groups = {};
  data.forEach(d => { groups[d.type] = (groups[d.type] || 0) + 1; });
  if (charts.type) charts.type.destroy();
  charts.type = new Chart(document.getElementById('typeChart'), {
    type: 'doughnut',
    data: { labels: Object.keys(groups), datasets: [{ data: Object.values(groups), backgroundColor: [palette.accent, palette.accent2], borderColor: '#1A1E27', borderWidth: 2 }] },
    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom', labels: { boxWidth: 12, padding: 14 } } } }
  });
}

function renderRatingChart(ratingCounts) {
  const rows = Object.entries(ratingCounts).sort((a, b) => b[1] - a[1]).slice(0, 7);
  if (charts.rating) charts.rating.destroy();
  charts.rating = new Chart(document.getElementById('ratingChart'), {
    type: 'bar',
    data: { labels: rows.map(r => r[0]), datasets: [{ label: 'Titles', data: rows.map(r => r[1]), backgroundColor: palette.accent2, borderRadius: 3, maxBarThickness: 40 }] },
    options: { indexAxis: 'y', responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } },
      scales: { x: { grid: { color: palette.line } }, y: { grid: { display: false } } } }
  });
}

function renderYearChart(yearCounts) {
  const years = Object.keys(yearCounts).map(Number).sort((a, b) => a - b).filter(y => y >= 2008);
  const values = years.map(y => yearCounts[y]);
  if (charts.year) charts.year.destroy();
  charts.year = new Chart(document.getElementById('yearChart'), {
    type: 'line',
    data: { labels: years, datasets: [{ label: 'Titles added', data: values, borderColor: palette.accent, backgroundColor: 'rgba(95, 217, 196, 0.1)', fill: true, tension: 0.25, pointRadius: 3, borderWidth: 2 }] },
    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } },
      scales: { y: { grid: { color: palette.line } }, x: { grid: { display: false } } } }
  });
}
</script>
</body>
</html>
